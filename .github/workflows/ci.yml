name: CI

on:
  push:
    branches: [main, dc-use]
  pull_request:
    branches: [main, dc-use]

permissions:
  contents: read

jobs:
  windows-native:
    name: Windows daemon and file handles
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run native daemon and resource-handle tests
        run: >-
          python -m pytest -n 0 -o log_cli=true --log-cli-level=DEBUG
          -o faulthandler_timeout=90 --tb=long
          tests/test_watch_robustness.py::TestRealObserver::test_recreated_directory_survives_and_is_reindexed
